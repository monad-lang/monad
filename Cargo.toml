[workspace]
resolver = "2"
members = ["core", "cli", "wasm"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "ASL2"
authors = ["Anders Christiansen Sørby <anders@sorby.xyz>"]
homepage = "https://monad-lang.org"
repository = "https://tangled.org/monad-lang/monad"

[workspace.dependencies]
nom = "8.0.0"
paste = "1.0"
libc = "0.2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
im = "15.1"

# No `[profile.release]` section existed at all until now, so the host
# compiler ran at cargo's defaults: `codegen-units = 16` and `lto =
# false`. That matters more here than for a typical binary, because the
# workload that actually hurts is the Rust evaluator interpreting
# `lang/main.mo` -- a tight `core_eval.rs` dispatch loop calling into
# `core_native.rs`, split across crate boundaries that `lto = false`
# forbids inlining across. Measured A/B before keeping (see
# `plans/implementations/2026-09-09-compiler-optimization.md`, item B1).
[profile.release]
lto = "fat"
codegen-units = 1

# Cargo requires profile sections to live in the workspace root, not a
# member crate's own Cargo.toml (a member-level `[profile.release]` is
# silently ignored with a warning) — and `lto` specifically isn't a
# valid per-package override even at the root, so it can't just move to
# `profile.release.package.monad-wasm`. `wasm-pack build` auto-detects
# and prefers a `[profile.wasm-release]` profile over `[profile.release]`
# when one is present (inheriting from `release` for anything unset),
# so defining it here keeps the wasm crate's size tuning without
# changing release-profile behavior for `monad-rs`/`monad-core`.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
