# The self-hosted compiler's command-line front end -- the binary target.
# `lang` is the compiler itself, as a library; everything here is argv
# handling and the `build`/`run`/`check`/`test` drivers on top of it.

[mote]
name = "cli"
version = "0.1.0"
edition = "2026"

[[bin]]
name = "monad"
path = "src/main.mo"

[dependencies.init]
path = "../init"

[dependencies.std]
path = "../std"

# Argument parsing, which used to be this mote's own `src/args.mo`. `main.mo`
# is the one consumer here; the library moved out so a consumer needing only
# an argv parser does not pull the whole compiler in.
[dependencies.clap]
path = "../motes/clap"

# One function: `parse_i64`, for `monad test --jobs/-j <N>`'s value. The
# same tested string-to-int the driver result file already goes through
# (`parse_driver_result`, lang/src/codegen/test_driver.mo).
[dependencies.parsec]
path = "../motes/parsec"

# The build orchestrator: input hashing and the artifact store.
[dependencies.build]
path = "../build"

[dependencies.lang]
path = "../lang"

[dependencies.llvm]
path = "../llvm"

[dependencies.runtime]
path = "../runtime"

# The language server, which the binary's `lsp` subcommand starts. It is a
# dependency of THIS mote and not of `lang`, because it is the other end of
# the same stream: what a language server needs from a compiler is the
# checker's answers about a buffer that is not a file yet, and that is the
# whole of the interface. Sub-table rather than an inline table, like every
# other dependency here -- the self-hosted TOML reader has no inline tables,
# and a manifest it cannot parse disables the declared-deps check silently
# instead of failing.
[dependencies.lsp]
path = "../motes/lsp"
