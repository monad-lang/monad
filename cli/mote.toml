# The self-hosted compiler's command-line front end -- the binary target.
# `lang` is the compiler itself, as a library; everything here is argv
# handling and the `build`/`run`/`check`/`test` drivers on top of it.

[mote]
name = "cli"
version = "0.1.0"
edition = "2026"

[[bin]]
name = "monad"
path = "src/main.mo"

[dependencies.init]
workspace = true

[dependencies.std]
workspace = true

# Argument parsing, which used to be this mote's own `src/args.mo`. `main.mo`
# is the one consumer here; the library moved out so a consumer needing only
# an argv parser does not pull the whole compiler in. `--jobs`' I64 validation
# is the clap parser's now, so `parsec` is no longer a dependency.
[dependencies.clap]
workspace = true

# The build orchestrator: input hashing and the artifact store.
[dependencies.build]
workspace = true

[dependencies.lang]
workspace = true

# The compiler backend: the CLI drives it after the front end.
[dependencies.codegen]
workspace = true

# The formatter behind `monad fmt`. It is a dependency of THIS mote and not of
# `lang`: formatting is a tool over source text, not a compiler stage, and the
# strict-parse gate it is wrapped in here is the compiler's business.
[dependencies.fmt]
workspace = true

# The shared evaluator behind `monad eval` and `monad repl`: `eval::file`'s
# filesystem entry plus (for the REPL) `eval::session`. The recipe itself
# is `eval::run`, which the browser engine imports too.
[dependencies.eval]
workspace = true

[dependencies.llvm]
workspace = true

[dependencies.runtime]
workspace = true

# The language server, which the binary's `lsp` subcommand starts. It is a
# dependency of THIS mote and not of `lang`, because it is the other end of
# the same stream: what a language server needs from a compiler is the
# checker's answers about a buffer that is not a file yet, and that is the
# whole of the interface. Sub-table rather than an inline table, like every
# other dependency here -- the self-hosted TOML reader has no inline tables,
# and a manifest it cannot parse disables the declared-deps check silently
# instead of failing.
#
# Gated by the `lsp` feature (see `[features]` below): `cli/src/main.mo`'s
# `use lsp::server` and its `Command.lsp` arm carry
# `#[cfg {feature := "lsp"}]`, so building without the feature drops the
# module from the load closure and `lsp` from the link.
#
# What that buys is LOAD TIME AND LINK SURFACE, not a smaller dependency
# graph: `motes/lsp` declares `lang`, `toolkit`, `json`, `fmt`, `log`,
# `llvm` and `runtime`, and `cli` pulls every one of those in anyway. If a
# genuinely smaller compiler binary is the goal, `motes/lsp`'s own closure
# is the thing to look at, not this gate.
[dependencies.lsp]
workspace = true

# `monad doc`: the API reference generator. A dependency of THIS mote and not
# of `lang`, because a reference is a tool over source ranges, not a compiler
# stage -- `DocGen.build` reads the same `toolkit::decl_text` outline the
# language server does.
#
# Gated by the `doc` feature: `cli/src/main.mo`'s `use docgen::gen` and its
# `Command.doc` arm carry `#[cfg {feature := "doc"}]`. This is the gate that
# actually SHRINKS the build -- `acorn`, `markdown` and `xml_html` ride in
# with docgen and nothing else in `cli` needs them.
[dependencies.docgen]
workspace = true

# `monad lint`: the style/hygiene linter, which is `motes/linter`'s library.
# An edge from THIS mote and not from `lang`, because a linter is a tool over
# a parse, not a compiler stage -- and NOT the reverse direction either: the
# linter must not depend on `cli`, which would be circular now that `cli`
# dispatches to it.
#
# Gated by the `linter` feature, like `doc` and `lsp`. `motes/linter` declares
# `[features] default = []`, so it costs nothing to depend on.
[dependencies.linter]
workspace = true

# Optional parts of the binary, off-switchable from the outside:
#
#     monad build cli                                 # everything (default)
#     MONAD_FEATURES="not cli/default" monad build cli # a bare compiler
#     MONAD_FEATURES="not cli/lsp" monad build cli     # no editor server
#     MONAD_FEATURES="not cli/linter" monad build cli   # no `monad lint`
#
# A feature here gates a `use` plus the subcommand's dispatch arm, so an
# unbuilt subcommand does not merely fail at runtime -- its module is never
# loaded. `Command.lsp`/`Command.doc` still PARSE without the feature (the
# spec is one declaration, and the help text must not depend on the build);
# their arms report that the binary was built without the feature.
#
# `default` is what every existing caller gets, so `monad build cli` and the
# bootstrap ladder are unchanged. `not` subtracts -- see `CfgEnv.for_mote`
# (`lang/src/cfg.mo`) and `CfgSet::with_manifest_features`
# (`rust/core/src/cfg.rs`), which must agree.
[features]
default = ["doc", "lsp", "linter"]
doc = []
lsp = []
linter = []

# Affine-by-default migration exception (measured 2026-10-22).
# Delete this table when the mote reaches zero violations; the default
# (no table) is `mode = "error"`. See plans/type-system/quantitative-types.md.
[affine]
mode = "warn"
