# The terminal-UI library: pure-functional core types, layout, a widget tree,
# and the render/diff/ANSI pipeline, plus terminal control (`terminal.mo`'s
# one `term_ctl` native -- cbreak mode and TIOCGWINSZ -- with everything
# else pure ANSI strings).

[mote]
name = "tui"
version = "0.1.0"
edition = "2026"

# `init` and `std` are ambient and need no entry; declared anyway because
# every other manifest here declares them. See motes/parsec/mote.toml.
[dependencies.init]
workspace = true

[dependencies.std]
workspace = true

# The argument parser, for `src/tests/cli_demo.mo`'s `#[derive_cli]` demo --
# the launch-argument pattern an application built on this library would
# follow. This used to be a dependency on the whole `cli` mote, which dragged
# `lang`/`llvm`/`runtime`/`build`/`lsp` in to get one attribute.
[dependencies.clap]
workspace = true

# Affine-by-default migration exception (measured 2026-10-22).
# Delete this table when the mote reaches zero violations; the default
# (no table) is `mode = "error"`. See plans/type-system/quantitative-types.md.
[affine]
mode = "warn"
