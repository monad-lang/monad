# Weaver -- the interactive coding agent on shuttle: the approval
# policy, the dumb-mode and TUI UIs, the slash commands and the
# settings, over shuttle's headless harness
# (plans/implementations/weaver.md). No `loom` dep yet: Phase 7 (Loom
# mounts) is gated on plugin-framework, and a manifest dep that nothing
# imports is a lie.
[mote]
name = "weaver"
version = "0.1.0"
edition = "2026"

[dependencies.init]
path = "../../init"

[dependencies.std]
path = "../../std"

[dependencies.log]
path = "../log"

[dependencies.json]
path = "../json"

[dependencies.shuttle]
path = "../shuttle"

[dependencies.tui]
path = "../tui"

# The pty/TUI test harness (`motes/mty`) used by the drivers under `test/`.
# Weaver's binary does not import it; the dependency exists so the test files
# can `use mty::...` without failing the declared-deps gate.
[dependencies.mty]
path = "../mty"

[dependencies.toml]
path = "../toml"

[dependencies.clap]
path = "../clap"

[dependencies.mcp_client]
path = "../mcp_client"

[dependencies.parsec]
path = "../parsec"

# Assistant Markdown is rendered through the markdown mote; the plan-file
# workflow uses its YAML frontmatter split and the yaml mote, and dates
# use the time mote. `xml_html` is here for the same reason `llvm`/`runtime`
# are below: markdown's library root re-exports its HTML renderer, so the
# module graph reaches `xml_html` even when weaver only renders styled text.
[dependencies.markdown]
workspace = true

[dependencies.xml_html]
workspace = true

[dependencies.yaml]
workspace = true

[dependencies.time]
workspace = true

# The Monad-aware tools (`monad_check`, `monad_eval`) run the compiler's
# checker and interpreter in-process, so the whole `lang` engine is a
# dependency. `llvm` and `runtime` are declared for the same reason
# `motes/lsp/mote.toml` declares them: `lang::module`'s graph reaches
# codegen and the IR type names, and without them the module graph fails
# with `module not found: llvm.strmap`.
[dependencies.lang]
path = "../../lang"

# `monad_eval` runs through the shared evaluator's filesystem entry
# (`eval::file`), the same pipeline `monad eval` uses.
[dependencies.eval]
path = "../../eval"

[dependencies.llvm]
path = "../../llvm"

[dependencies.runtime]
path = "../../runtime"

# Affine-by-default migration exception (measured 2026-10-22).
# Delete this table when the mote reaches zero violations; the default
# (no table) is `mode = "error"`. See plans/type-system/quantitative-types.md.
[affine]
mode = "warn"
