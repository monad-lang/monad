# Weaver -- the interactive coding agent on shuttle: the approval
# policy, the dumb-mode and TUI UIs, the slash commands and the
# settings, over shuttle's headless harness
# (plans/implementations/weaver.md). `loom` is declared from Phase 7 on:
# the slash-command table mounts commands as Loom `Strand`s and the
# approval gate and settings are mounted as Loom `Service`s.
[mote]
name = "weaver"
version = "0.1.0"
edition = "2026"

# Every source is inherited from the root's `[workspace.dependencies]`
# (mote.toml), so a path moves in one place. An inherited path resolves
# from the workspace ROOT, not from this directory.
[dependencies.init]
workspace = true

[dependencies.std]
workspace = true

[dependencies.log]
workspace = true

[dependencies.loom]
workspace = true

[dependencies.json]
workspace = true

[dependencies.shuttle]
workspace = true

[dependencies.tui]
workspace = true

# The pty/TUI test harness (`motes/pty`) used by the drivers under `test/`.
# Weaver's binary does not import it; the dependency exists so the test files
# can `use pty::...` without failing the declared-deps gate.
[dependencies.pty]
workspace = true

[dependencies.toml]
workspace = true

[dependencies.clap]
workspace = true

[dependencies.mcp_client]
workspace = true

[dependencies.parsec]
workspace = true

[dependencies.time]
workspace = true

# Assistant Markdown is rendered through the markdown mote; plan files use
# its YAML frontmatter split and the yaml mote. `xml_html` is here because
# markdown's library root re-exports its HTML renderer, so the module graph
# reaches `xml_html` even when weaver only renders styled text. Calendar
# dates come from the `time` mote.
[dependencies.markdown]
workspace = true

[dependencies.xml_html]
workspace = true

[dependencies.yaml]
workspace = true


# The Monad-aware tools (`monad_check`, `monad_eval`) shell out to the
# `monad` binary, so the compiler (`lang`, `eval`, `llvm`, `runtime`) is not
# linked into weaver. `WEAVER_MONAD_BIN` picks another binary.

# Affine-by-default migration exception (measured 2026-10-22).
# Delete this table when the mote reaches zero violations; the default
# (no table) is `mode = "error"`. See plans/type-system/quantitative-types.md.
[affine]
mode = "warn"
