# ELF parsing -- the first real consumer of `parsec`'s BINARY input.
#
# The library (`src/elf.mo`) reads a `Bytes` cursor (`parsec::input`), so it
# is pure and needs nothing from `std` but the buffer TYPE; the `elfinfo`
# binary is the thin I/O shell that reads a file into a `Buf U8`
# (`IO.read_file_buf`) and prints what the parser found.
#
# The binary and the tests need the `buf` feature: they call `Buf.of_list` /
# `Buf.of_bytebuf` / `IO.read_file_buf` (see `std/mote.toml`). Off by
# default, matching `std/buf`: the two must be enabled together, and until a
# nightly carries the natives that means `MONAD_FEATURES=std/buf,elf/buf`
# with a compiler built from this tree. The LIBRARY has no native
# dependency, so it also compiles with the feature off.
#
# `parsec` is a path dependency through the workspace, like `json`'s.
[mote]
name = "elf"
version = "0.1.0"
edition = "2026"

[lib]
path = "src/lib.mo"

[[bin]]
name = "elfinfo"
path = "src/main.mo"

[dependencies.init]
workspace = true

[dependencies.std]
workspace = true

[dependencies.parsec]
workspace = true

[dependencies.clap]
workspace = true

[features]
default = []
buf = []
