# Oak: declarative HTML builders over the shared xml_html core, an indexed
# page-assembly transformer, and a host-agnostic Cmd/App layer.
#
# `init` and `std` are ambient; declared anyway as every manifest here does.
# `xml_html` owns Html.Attr/Html.Node and the serializer; Oak only builds
# nodes, it never parses or escapes (one serializer, two producers).

[mote]
name = "oak"
version = "0.1.0"
edition = "2026"

[dependencies.init]
workspace = true

[dependencies.std]
workspace = true

[dependencies.xml_html]
workspace = true

# The pure event vocabulary shared with the browser boundary. Oak names it in
# `Oak.Attr.on`; `web_wasm` builds it. Neither depends on the other.
[dependencies.web_event]
workspace = true

# `Ssr.to_response` names `http.Response`; the view library itself never
# depends on the server (`moon` does not depend on Oak).
[dependencies.http]
workspace = true

# Affine-by-default migration exception (measured 2026-10-22).
# Delete this table when the mote reaches zero violations; the default
# (no table) is `mode = "error"`. See plans/type-system/quantitative-types.md.
[affine]
mode = "warn"
