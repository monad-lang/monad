<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>oak_ui book</title>
  <meta name="description" content="Browse, tweak and inspect the oak_ui components.">
  <!-- Generated by book_static: theme variables, the component sheet and the explorer chrome. -->
  <link rel="stylesheet" href="./oak-ui.css">
</head>
<body>
  <div id="app"></div>
  <noscript>The live explorer needs JavaScript and WebAssembly. The static gallery is at <a href="./gallery/index.html">gallery/</a>.</noscript>
  <script type="module">
    import { start } from './web.js';
    start('./oak_ui_book.wasm', '#app').catch((err) => {
      document.getElementById('app').textContent = 'Could not load the explorer: ' + err;
    });
  </script>
</body>
</html>
