# A standalone, typed client for the Anthropic Messages API --
# faithful to the wire shape (not shuttle's own Message/Turn normal
# form), mirroring `motes/openai`'s own split: the wire types and
# codecs live in `src/types.mo`, the HTTP call in `src/client.mo`.
[mote]
name = "anthropic"
version = "0.1.0"
edition = "2026"

[dependencies.init]
workspace = true

[dependencies.std]
workspace = true

[dependencies.json]
workspace = true

[dependencies.http]
workspace = true

[dependencies.moose]
workspace = true

# Affine-by-default migration exception (measured 2026-10-22).
# Delete this table when the mote reaches zero violations; the default
# (no table) is `mode = "error"`. See plans/type-system/quantitative-types.md.
[affine]
mode = "warn"
