[mote]
name = "moon"
version = "0.1.0"
edition = "2026"

# Sub-table, not an inline table (`http = { path = "../http" }`): the
# self-hosted TOML reader supports headers and not inline tables, and a
# manifest it cannot parse makes `Mote.discover` return none -- which
# silently turns the declared-deps check off for this mote rather than
# failing. See the note in the repo root's mote.toml.
[dependencies.http]
workspace = true

# Opt-in only: `moon::session_crypto` is not re-exported from `lib.mo`, so a
# program that never imports it does not load these externs and does not
# link libcrypto. See `src/session_crypto.mo`.
[dependencies.crypto]
path = "../crypto"

# Affine-by-default migration exception (measured 2026-10-22).
# Delete this table when the mote reaches zero violations; the default
# (no table) is `mode = "error"`. See plans/type-system/quantitative-types.md.
[affine]
mode = "warn"
