# Loom Phase 1 (plans/library-ideas/plugin-framework.md): a fixed/
# closed-Gamma `Warp`, reusing the already-landed, already-tested
# Comonad (Pair E) instance from init/src/prelude.mo rather than
# inventing a new one. `init`/`std` only -- Phase 1 needs nothing else.
[mote]
name = "loom"
version = "0.1.0"
edition = "2026"

[dependencies.init]
path = "../../init"

[dependencies.std]
path = "../../std"

# Affine-by-default migration exception (measured 2026-10-22).
# Delete this table when the mote reaches zero violations; the default
# (no table) is `mode = "error"`. See plans/type-system/quantitative-types.md.
[affine]
mode = "warn"
