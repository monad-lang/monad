# The shared protocol substrate for Monad's tool servers: wire framing,
# JSON-RPC 2.0, and position conversion. `motes/lsp` is the first consumer;
# the MCP server, a linter and a formatter are the ones this exists for.
#
# Named `toolkit` rather than `lsp` on purpose: nothing here knows what an
# LSP is. Framing and JSON-RPC are the same for MCP, the position and
# diagnostic conversions are the same for anything that reports where
# something is in a file, and the point of splitting them out is that the
# next server does not reimplement them.

[mote]
name = "toolkit"
version = "0.1.0"
edition = "2026"

# Sub-table, not an inline table (`std = { path = "../../std" }`): the
# self-hosted TOML reader supports headers and not inline tables, and a
# manifest it cannot parse makes `Mote.discover` return none -- which
# silently turns the declared-deps check off for this mote rather than
# failing. See the note in the repo root's mote.toml.
#
# The paths climb two levels because this mote lives under `motes/`.
# `motes/ffi_example/mote.toml` is the precedent, and it declares the same
# five dependencies in the same form.
[dependencies.init]
path = "../../init"

[dependencies.std]
path = "../../std"

# `lang` is here for its `Json`, which `jsonrpc.mo` parses into and writes out
# of, and for its `Diagnostic`, which `diagnostic.mo` converts to the wire.
# `framing`/`bytes`/`position` stay deliberately free of it and take plain
# `I64` coordinates. The edge is honest: every consumer of this mote (the LSP
# server, the MCP server, a linter, a formatter) already depends on `lang` to
# check Monad source in the first place. What it costs is test load time,
# since a mote's whole dependency closure loads to run one test file.
[dependencies.lang]
path = "../../lang"

[dependencies.json]
path = "../json"

# `llvm` and `runtime` are declared because `lang::module` -- where `Diagnostic`
# lives -- is not self-contained the way `lang::json` is: the compiler's own
# modules reach into codegen, codegen reaches into `llvm`, and the IR type names
# come from `llvm::strmap`. Without these the module graph fails to resolve with
# `module not found: llvm.strmap`, which names the symptom and not the cause.
# `motes/ffi_example` declares the same pair for the same reason.
[dependencies.llvm]
path = "../../llvm"

[dependencies.runtime]
path = "../../runtime"

# Affine-by-default migration exception (measured 2026-10-22).
# Delete this table when the mote reaches zero violations; the default
# (no table) is `mode = "error"`. See plans/type-system/quantitative-types.md.
[affine]
mode = "warn"
