# The browser platform boundary. This mote is wasm-only: every extern it
# declares is implemented by the web runtime (`runtime/src/platform_web.c`
# / `wasm/web/web_runtime.js`). The runtime side is not implemented yet, so
# the `web_*` symbols are unbound on every target today; a non-web build
# fails at link rather than silently doing nothing.
#
# ALL web externs live here. Side-effecting externs are declared `RawIO A`
# and exposed through the thin `IO` wrappers in `dom.mo`, `fetch.mo`,
# `clock.mo`, `storage.mo` and `console.mo`. No other mote declares a
# DOM/fetch/event/timer/storage extern.
#
# `targets` is a declaration of intent; neither loader enforces it yet, so a
# native build is stopped late (at link) rather than at load.
#
# `jsgen` renders the browser glue from `src/web_abi.mo`, so the import map,
# the C declarations and the externs cannot drift.
[mote]
name = "web_wasm"
version = "0.1.0"
edition = "2026"
targets = ["web"]

[dependencies.init]
path = "../../init"

[dependencies.std]
path = "../../std"

[dependencies.jsgen]
path = "../jsgen"
