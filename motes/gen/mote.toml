# A code-generation library: builders over `lang`'s term/declaration types,
# a binder stack for de Bruijn indices, and a balanced dispatch-tree
# emitter. See plans/library-ideas/codegen.md.
#
# It depends on `lang` because that is where the AST and the source printer
# live; the cost is the compiler's own load time on every check of a
# generator, which is a dev-time tool, never a library a program links.
[mote]
name = "gen"
version = "0.1.0"
edition = "2026"

[lib]
path = "src/lib.mo"

[dependencies.init]
path = "../../init"

[dependencies.std]
path = "../../std"

[dependencies.lang]
path = "../../lang"

# Test-only: the emitter's output is re-parsed, so the tests name
# `ParseResult`.
[dev-dependencies.parsec]
path = "../parsec"

# Affine-by-default migration exception (measured 2026-10-22). Delete this
# table when the mote reaches zero violations; the default (no table) is
# `mode = "error"`. See plans/type-system/quantitative-types.md.
[affine]
mode = "warn"
