# The self-hosted compiler, as a library.

[mote]
name = "lang"
version = "0.1.0"
edition = "2026"

[lib]
path = "src/lib.mo"

[dependencies.init]
path = "../init"

[dependencies.std]
path = "../std"

[dependencies.llvm]
path = "../llvm"

[dependencies.runtime]
path = "../runtime"
[dependencies.parsec]
path = "../motes/parsec"

[dependencies.toml]
path = "../motes/toml"

# Affine-by-default migration exception (measured 2026-10-22).
# Delete this table when the mote reaches zero violations; the default
# (no table) is `mode = "error"`. See plans/type-system/quantitative-types.md.
[affine]
mode = "warn"
