# The site build of .github/workflows/site.yml, and only that build.
#
# The GitHub workflow's second job deploys to Pages via
# actions/configure-pages + actions/deploy-pages. Tangled has no upload-an-
# artifact equivalent -- a Tangled site serves files straight out of a branch
# and a deploy directory -- so porting that job would mean committing the
# rendered site back to a branch with a push credential. That is a publishing
# decision with a secret attached, not an obvious mirror of what the GitHub
# workflow does, so this file stops at the build.
#
# Which is the half that catches defects anyway: a broken SUMMARY.md, a
# chapter that no longer resolves, a link to a page acorn does not write
# (the build fails on a broken internal link before writing anything), a
# `docs/site.toml` the config reader rejects.
#
# The compiler is the flake's `.#monad`, as in .tangled/workflows/test.yml --
# not `monadup default`, so this does not depend on the runner's home
# directory having a toolchain. `scripts/build-docs.sh` uses MONAD when it is
# set, which keeps the build-try step on the same compiler.
#
# The `paths` filter is the one trigger difference from the file it mirrors:
# this is the cheapest workflow in the directory and it cannot be affected by
# anything outside docs/, so it does not need to run on every push. (Spindle
# takes `paths` per constraint, alongside branch and tag.)
environment:
  DEVENV_SKIP_TASKS: "1"

when:
  - event: ["push", "pull_request"]
    branch: ["main"]
    paths:
      - "docs/**"
  - event: ["manual"]

engine: microvm
image: nixos

dependencies:
  - git

steps:
  - name: Build the site with acorn
    command: |
      nix develop --no-pure-eval --accept-flake-config -c \
        env MONAD="$(nix build --no-link --print-out-paths --accept-flake-config .#monad)/bin/monad" \
        scripts/build-docs.sh
