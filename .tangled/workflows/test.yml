# The sweep half of the `compiler-checks` job in .github/workflows/ci.yml --
# the `test` job, until that job absorbed `bootstrap`. The GitHub side now runs
# this same sweep against the ladder's own release rung-1 and starts it while
# the ladder is still finishing (scripts/ci-compiler-checks.sh); here it still
# builds `.#monad` first, which is correct but pays a build the GitHub job
# gets for free -- and since the release family moved to the pinned nightly
# as its host (nix/nightly.nix), that build is a ~2-minute rung plus the
# relink, not the interpretation this used to cost.
#
# Two steps: the flake builds the compiler this job sweeps (`packages.monad` --
# rung 1, from this commit's tree), then
# scripts/check-monad-tests.sh runs that binary over the corpus. Called
# directly rather than through
# `devenv tasks run monad:test` (its local equivalent), as the GitHub job does,
# so the per-file verdicts reach this log -- devenv-tasks captures a task's
# stdout and shows it only on failure.
#
# The path cannot be carried in `environment:` above -- it does not exist until
# the first step has built it -- and Spindle has no GITHUB_ENV equivalent, so
# the consuming step resolves it itself: by then the build is in this microVM's
# store, so the second `nix build` is an evaluation and a cache hit rather than
# a second build. A leading `VAR=...` assignment is what puts it in the child's
# environment, which is what the GitHub job's `$GITHUB_ENV` write does too.
#
# The GitHub job carries `timeout-minutes: 120` as a hang guard. Spindle has no
# per-workflow timeout field -- the spindle operator sets one default
# (SPINDLE_MICROVM_PIPELINES_WORKFLOW_TIMEOUT) that applies to every workflow it
# runs, and the value it ships with is 5m, far under this job's needs. That
# raise is a host prerequisite, not something this file can express; see
# monad-nixos-modules/modules/spindle.nix.
environment:
  DEVENV_SKIP_TASKS: "1"

when:
  - event: ["push", "pull_request"]
    branch: ["main"]
  - event: ["manual"]

engine: microvm
image: nixos

dependencies:
  - git

steps:
  - name: Build the compiler from the flake
    command: nix build --no-link --accept-flake-config .#monad

  - name: Run tests
    command: |
      MONAD_BIN="$(nix build --no-link --print-out-paths --accept-flake-config .#monad)/bin/monad" \
        nix develop --no-pure-eval --accept-flake-config -c \
          scripts/check-monad-tests.sh
