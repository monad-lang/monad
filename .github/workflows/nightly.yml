name: Nightly release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    if: github.repository == 'monad-lang/monad'
    runs-on: [self-hosted, linux]
    # Hang guard: the self-compile has no deadline of its own (the CI
    # bootstrap task streams a --verbose stage trace instead), so this
    # is the only thing that stops a wedged run from holding the runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # The whole build -- compile, verification, staged artifacts and the
      # `tag`/`date` outputs the release step below reads -- happens inside
      # this one dev-shell entry. Two things drive the shape of it:
      #
      #   * a bare `run:` gets the RUNNER HOST's PATH, not the devenv's,
      #     which is how `file` went missing here while devenv.nix listed it;
      #   * the script writes those two step outputs itself, into
      #     $GITHUB_OUTPUT, so splitting them into a second `nix develop`
      #     entry would buy nothing and add a second way for the release job
      #     to fail over something that has nothing to do with the release.
      #     (Note it is the *outputs*, not the cost of a second entry, that
      #     decide this. A dev-shell entry is not cheap: the flake devShell's
      #     shellHook runs `devenv-tasks run devenv:enterShell --mode all`,
      #     which resolves the whole task graph -- including
      #     `devenv:git-hooks:run`, the full `prek run -a`, 75s warm and 291s
      #     measured cold -- so hoisting these two outputs into a second
      #     `nix develop -c` would buy a second sweep. Written here, they cost
      #     nothing.)
      #
      # The script is called directly rather than through
      # `devenv tasks run monad:nightly` (which is the local equivalent):
      # devenv-tasks captures a task's stdout and shows it only on failure,
      # which would swallow the `file` output, the recorded commit and the
      # compile's --verbose stage trace -- the evidence that says what got
      # published.
      - name: Build and verify the nightly binary
        id: nightly
        run: |
          nix develop --no-pure-eval --accept-flake-config -c \
            scripts/nightly-release.sh

      - name: Create nightly prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.nightly.outputs.tag }}
          name: Nightly ${{ steps.nightly.outputs.date }}
          body: |
            Automated nightly build of the bootstrapped `monad` binary from `main`.

            Commit: ${{ github.sha }}

            This binary is produced by the self-hosted compiler
            (`cli/src/main.mo`) compiling itself, run through the Rust
            `monad-rs` reference interpreter. Built on a self-hosted
            Linux x86_64 runner with Nix devenv.
          prerelease: true
          make_latest: false
          files: |
            dist/monad-nightly-x86_64-linux
            dist/commit.txt
