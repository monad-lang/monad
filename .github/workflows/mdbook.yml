# Sample workflow for building and deploying a mdBook site to GitHub Pages
#
# To get started with mdBook see: https://rust-lang.github.io/mdBook/index.html
#
name: Deploy site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.4.36
      ZOLA_VERSION: 0.23.6
    steps:
      - uses: actions/checkout@v5

      # The pinned binary, not `rustup` + `cargo install --version
      # ${MDBOOK_VERSION} mdbook`. That installed an entire Rust toolchain
      # and compiled mdbook from source on every push to main, for a binary
      # the project already publishes for this platform -- minutes of a
      # GitHub-hosted runner spent to arrive at the same file.
      #
      # Same VERSION deliberately, and it is the one the published site has
      # been rendered with. The dev shell's mdbook (nix/packages.nix) is the LOCAL
      # preview copy, and that separation is stated there as intentional;
      # changing what renders monad-lang.org is a docs decision, not a CI
      # cleanup, so it is not smuggled in here.
      - name: Install mdBook
        run: |
          set -euo pipefail
          tarball="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -fsSL --proto '=https' \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${tarball}" \
            | tar -xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mdbook/mdbook" --version
      - name: Install Zola
        run: |
          set -euo pipefail
          tarball="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$RUNNER_TEMP/zola"
          curl -fsSL --proto '=https' \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/${tarball}" \
            | tar -xz -C "$RUNNER_TEMP/zola"
          echo "$RUNNER_TEMP/zola" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zola/zola" --version
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build docs with mdBook
        run: cd docs && mdbook build
      # `scripts/monadup` is canonical; Zola serves the generated copy at
      # https://monad-lang.org/install. The copy is build output (gitignored),
      # written here just before the site build.
      - name: Stage the install script
        run: scripts/sync-install.sh
      - name: Build site with Zola
        run: zola --root docs/site build -o docs/public --force
      - name: Add CNAME
        run: cp CNAME docs/public/CNAME
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
