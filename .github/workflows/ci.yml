name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5

      # Populates the shared cargo/target cache once so the three jobs
      # below (which all restore the SAME key) hit a warm cache instead
      # of each independently doing a full `cargo build` from cold in
      # parallel. `--workspace` builds every crate (including monad-wasm)
      # so nothing downstream has to compile a crate this job skipped.
      # No actions/cache needed — target/ and ~/.cargo persist on the
      # self-hosted runner's filesystem between runs.
      - name: Build release binary
        run: nix develop --no-pure-eval --accept-flake-config -c cargo build --release --workspace

  pre-commit-checks:
    needs: build
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5

      - name: Run pre commit checks
        run: nix develop --no-pure-eval --accept-flake-config -c devenv tasks run devenv:git-hooks

  test:
    needs: build
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        run: nix develop --no-pure-eval --accept-flake-config -c devenv tasks run monad:test

  bootstrap:
    needs: build
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5

      - name: Bootstap compiler
        run: nix develop --no-pure-eval --accept-flake-config -c devenv tasks run monad:bootstrap-compile
