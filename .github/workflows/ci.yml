name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rust:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5

      # Builds every crate once (`--workspace`, including monad-wasm) so
      # the jobs below don't race to build the same crates in parallel.
      # NOTE: this does NOT warm target/ for the other jobs — each job
      # runs in its own ephemeral container on the self-hosted runner, so
      # every job cold-builds what it needs (the fat-LTO release profile
      # makes that ~10 min). That is expected wall time, not a failure:
      # the bootstrap job deliberately has no compile deadline, only the
      # job-level timeout-minutes hang guard below.
      - name: Build release binary
        run: nix develop --no-pure-eval --accept-flake-config -c cargo build --release --workspace

  pre-commit-checks:
    needs: build-rust
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5

      # The one step that stays a devenv task rather than calling a script
      # directly: `devenv:git-hooks:run` is `prek run -a` against
      # .pre-commit-config.yaml, which is gitignored and generated at run time
      # by devenv's own `devenv:files` task. Its output reaches this log because
      # devenv.nix sets `showOutput` on that task; without it devenv-tasks
      # would capture the per-hook output and print it only on failure.
      #
      # The sweep is not this job's alone. `nix develop -c` runs the whole task
      # graph at shell entry in EVERY step of every job (the devShell's
      # shellHook is `devenv-tasks run devenv:enterShell --mode all`, which
      # resolves the graph in both directions, not just enterShell's
      # prerequisites), and a hook failing there exits 1 from `nix develop`
      # before this command is reached. So this job's verdict is really decided
      # at shell entry; whether these two lines add to it is secondary. See the
      # `showOutput` setting in devenv.nix for why that entry-time sweep now
      # prints its per-hook results on a green run instead of staying captured.
      - name: Run pre commit checks
        run: nix develop --no-pure-eval --accept-flake-config -c devenv tasks run devenv:git-hooks

  test:
    needs: build-rust
    runs-on: [self-hosted, linux]
    # Hang guard, not a deadline: expected ~10 min cold build + test run.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # The script is called directly rather than through
      # `devenv tasks run monad:test` (its local equivalent): devenv-tasks
      # captures a task's stdout and shows it only on failure, which would
      # swallow the per-file verdicts that say what failed.
      - name: Run tests
        run: |
          nix develop --no-pure-eval --accept-flake-config -c \
            scripts/check-monad-tests.sh

  bootstrap:
    needs: build-rust
    runs-on: [self-hosted, linux]
    # Hang guard, not a compile deadline: the interpreted self-compile is
    # ~320s best case but stretches under load from the runner's own
    # parallel jobs; ~10 min cold cargo build + a slow compile still fits
    # far inside 90 min. A healthy run is never killed by this.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # Both steps call their script directly rather than through
      # `devenv tasks run monad:bootstrap-compile` / `monad:debug-oracle` (the
      # local equivalents): devenv-tasks captures a task's stdout and shows it
      # only on failure, and here the output IS the diagnostic -- the compile's
      # --verbose per-module stage trace, and the oracle's per-file verdicts.
      #
      # The two steps must stay in one job: the oracle reuses the binary the
      # compile wrote to ${TMPDIR:-/tmp}/monad-bootstrap-ci/monad.
      - name: Bootstrap compiler
        run: |
          nix develop --no-pure-eval --accept-flake-config -c \
            scripts/bootstrap-compile.sh
      - name: Debug transparency oracle
        run: |
          nix develop --no-pure-eval --accept-flake-config -c \
            scripts/debug-oracle.sh
