name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Cache cargo/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Runs enterTest (devenv.nix): git hooks via prek (rustfmt, clippy,
      # `cargo test --release`, and the fast .mo sweep), plus slow_tests/.
      # devenv's own task scheduling then runs the `monad:bootstrap-compile`
      # task (self-hosted compiler compiling its own source) right after, so
      # this is the full test suite, not just the local fast subset.
      # TODO: slow_tests/ and monad:bootstrap-compile are currently
      # non-blocking (both known-broken, fixes in progress on separate
      # branches) -- see devenv.nix's own TODOs.
      - name: Run tests
        run: devenv test
