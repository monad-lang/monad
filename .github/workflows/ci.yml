name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Per-ref, which for a pull request is `refs/pull/N/merge`: a new push to a
# PR cancels that PR's own previous run, which is the intent, and two PRs
# never cancel each other.
#
# Grouping on the PR's head branch instead was considered as a way to
# collapse "a PR's run and its branch's push" and DECLINED, because that
# duplicate cannot exist with these triggers: `push` is filtered to
# `branches: ["main"]`, so a push to a feature branch starts no workflow at
# all, and a branch's only runs are its PR's. What such a grouping would
# actually collapse is a push to `main` and the PR run of the commit before
# it -- i.e. it would cancel the post-merge verification of `main`, which is
# a defect rather than a saving. The 5413-9848 s queue waits in run
# 36301331844 are not this mechanism either: they are two runners serving more
# parallel jobs than they can hold while another branch's pipeline holds both,
# and cancelling across refs would take capacity away from a branch that is
# legitimately queued. Merging the compiler jobs removes one of those jobs; it
# does not remove the two runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every `nix develop -c` below would otherwise pay the devShell's shellHook,
  # `devenv-tasks run devenv:enterShell --mode all`. `--mode all` walks the
  # whole task graph in both directions, so entry reaches
  # `devenv:git-hooks:run` -- the full `prek run -a` (clippy, rustfmt,
  # shellcheck, docs-check, commit-msg-format): 521-559s cold and 76-77s warm
  # in this repo's job logs, seven times per pipeline, and only one of those
  # runs is any job's verdict. That range was measured with seven hooks; two of
  # them (`cargo test --release`, and the whole-corpus `check` at one severity
  # stricter) are now steps of their own below, so the sweep is narrower now
  # than what the range measured.
  #
  # DEVENV_SKIP_TASKS is the shellHook's
  # own off switch -- devenv's tasks.nix guards the invocation with
  # `if [ -z "${DEVENV_SKIP_TASKS:-}" ]` and does nothing else with it -- so
  # setting it here suppresses every entry-time sweep, including the nested
  # entry the `devenv` CLI makes for `devenv tasks run` (the variable is
  # inherited), while leaving the one job that WANTS the sweep working:
  # `pre-commit-checks` runs `devenv tasks run devenv:git-hooks` explicitly, and
  # that is a separate devenv-tasks invocation. A job that genuinely needs the
  # entry sweep can opt back in with `env: DEVENV_SKIP_TASKS: ""` (the guard is a
  # `-z` test, so the empty string re-enables it). The shellHook's other lines --
  # the PATH exports, the `.devenv/run` symlink, `mkdir -p "$PREK_HOME"` -- sit
  # OUTSIDE the guard and are unaffected.
  DEVENV_SKIP_TASKS: "1"

# The compile-heavy work is ONE job (`compiler-checks`), because the two jobs
# it replaces could overtake each other. This file ran `test` and `bootstrap`
# side by side until run 36914860312; the fleet has two runners and three jobs,
# and in that run the SHORTER compiler job took the runner first -- `changes`
# freed one at 19:31:12, `bootstrap` took it at 19:31:14, and `test`, the
# 49-minute critical path of a 59-minute pipeline, sat in the queue until
# 19:41:00. Ten minutes spent waiting for a machine that was running the other
# half of the same work, and no order left to get wrong now that both halves
# are one job. `scripts/ci-self-compile.sh` is that job's substance: a
# self-compile of this checkout hosted by the latest monadup nightly, falling
# back to the flake's Rust host when the nightly cannot build the tree. The
# TEST coverage lives in the Rust suite `pre-commit-checks` runs -- the
# self-hosted sweeps this replaces are not CI's to run anymore.
#
# It still runs in PARALLEL with `pre-commit-checks`, deliberately, so `needs:`
# was considered and declined on the measurements, not on taste:
#
#   * `needs: pre-commit-checks` on the compiler job would delay the
#     critical-path job by the lint's own 9m32s on every GREEN run, because
#     the gate would then run before the job it gates instead of beside it.
#     (Run 36243944155: pre-commit 13:04:33-13:14:05 on one runner while
#     `test` ran 13:04:33-14:12:08 on the other.) What it buys is real but
#     different -- up to an hour of runner time not spent on a run that fails
#     formatting -- and that is a cost trade for the maintainer, not a wall
#     clock win, so it is not made here.
#   * `[self-hosted, linux, monad-ci]` (the label registered by
#     monad-nixos-modules' modules/github-runner.nix) was considered as a way
#     to stop paying a cold build. It would not help: the 16-20 min
#     "Build the compiler from the flake" step is the same on both runners
#     (16m11s on anders-desktop in run 36243944155, 19m58s on nixos-server in
#     run 36238059186) because `.#monad` depends on this commit's whole source
#     tree, so it is cold on EVERY commit. Pinning a job to one machine would
#     remove scheduling freedom and buy nothing. The fix for that step is a
#     binary cache, and there is now one this repo owns: `monad-lang.cachix.org`,
#     declared in flake.nix's nixConfig and pushed by the `Push ... to the binary
#     cache` steps below (and in nightly.yml), via scripts/push-to-cache.sh. It
#     serves both runners and the Tangled microVMs alike; the host-side
#     `nix-serve`/attic route this comment used to name would only have reached
#     the two runners.
#
# `changes` precedes the rest and gates the jobs that would otherwise BUILD
# something: the compiler job on one answer, `flake-package` on another.
# That is neither a reversal of the above nor the `needs:` that was declined
# there: it is a path classifier that costs seconds (one checkout and a `git
# diff`, no nix, no cargo), and what it does is SKIP a job on a change that
# cannot reach it rather than delay a green one behind a gate. It exists
# because a docs-only change -- the traffic that fills the queue -- otherwise
# buys a 48-minute job to learn nothing; see scripts/ci-compiler-relevant.sh
# for the rules and for why a workflow-level `paths-ignore` would be wrong here
# (it would skip `docs-check`, a pre-commit hook, on exactly the changes that
# need it). Its second answer, `flake`, is new with `flake-package` and is an
# ALLOW-LIST where the first is a deny-list -- see scripts/ci-flake-relevant.sh
# for why one must never miss and the other must never buy a cold build for
# nothing.
#
# `pre-commit-checks` needs only `changes`, and no ANSWER gates the job: every
# run is still linted, rustfmt'd, clippy'd and doc-checked, so no required check
# is left pending. Only the Rust suite at the end of it reads the classifier --
# a change that touches no compiler input skips that STEP, and a skipped step
# reports success, unlike a skipped job.
jobs:
  # Decides whether the jobs below have anything to do. Answers over outputs
  # because the gates below read them. `fetch-depth: 0` because the classifiers
  # diff the change against the commit the event names as its base; the
  # repository's whole pack is ~11.5 MiB, so the full history costs seconds,
  # and a base that cannot be fetched makes them answer `true` (they fail
  # OPEN), so even a wrong guess costs time rather than signal.
  changes:
    runs-on: [self-hosted, linux]
    outputs:
      compiler: ${{ steps.classify.outputs.compiler }}
      flake: ${{ steps.classify.outputs.flake }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Both answers from ONE checkout and ONE diff, which is the only reason
      # two classifiers are cheap enough to have: each script walks the same
      # `git diff --name-only` output and neither is allowed to fail.
      #
      # They are separate scripts rather than one with a mode because their
      # shapes have to differ -- `ci-compiler-relevant.sh` names what is inert
      # and defaults to `true`, `ci-flake-relevant.sh` names what is relevant
      # and defaults to `false` -- and a single script with an inverted default
      # and a different path set is two scripts wearing one name.
      - id: classify
        name: Classify the change
        env:
          # `before` is the previous tip on a push and all zeros on a new
          # branch; `pull_request.base.sha` is the base tip. The scripts
          # treat both the zeros and an unreachable revision as `true`.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          compiler="$(scripts/ci-compiler-relevant.sh "$BASE")"
          flake="$(scripts/ci-flake-relevant.sh "$BASE")"
          echo "compiler=$compiler" >> "$GITHUB_OUTPUT"
          echo "flake=$flake" >> "$GITHUB_OUTPUT"
          echo "compiler-relevant: $compiler"
          echo "flake-relevant: $flake"

  pre-commit-checks:
    needs: changes
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5

      # docs-check, one of the hooks the step below runs, type-checks the
      # book's ```monad blocks. Its host is MONAD_BIN, set on the hooks
      # step: the checkout's own Rust host, `cargo run --release --`, NOT
      # the monadup-managed self-hosted nightly this step used to install.
      # A nightly is cut from main and can lag a branch that changes the
      # parser or its sources: on the derive-handler branch (PR #77) the
      # tree's std/derive.mo gained `#[derive_handler ...]`-annotated
      # defmacros the then-current nightly could not parse, and its
      # decls parser silently truncated the file at the first one, so
      # the book's `#[derive Lens]` fence failed with an "unknown
      # variable 'Point.y'" the checkout's own compilers never produce.
      # The Rust host is the bootstrap reference host -- exactly as
      # current as the tree under check, by construction -- and the
      # `use`-completeness step below already builds the same release
      # profile, so the host costs no extra build. Env, not GITHUB_PATH:
      # MONAD_BIN is a variable scripts/check-docs.sh reads directly,
      # and the dev shell inherits the step's environment.

      # The one step that stays a devenv task rather than calling a script
      # directly: `devenv:git-hooks:run` is `prek run -a` against
      # .pre-commit-config.yaml, which is gitignored and generated at run time
      # by devenv's own `devenv:files` task. Its output reaches this log because
      # devenv.nix sets `showOutput` on that task; without it devenv-tasks
      # would capture the per-hook output and print it only on failure.
      #
      # With DEVENV_SKIP_TASKS=1 set above, the entry-time sweep is off in every
      # step of every job. This explicit `devenv tasks run devenv:git-hooks` is
      # the ONLY run of the pre-commit suite in the pipeline, so this job's
      # verdict is decided here, not at shell entry. See the `showOutput` setting
      # in devenv.nix for why the per-hook results print on a green run.
      - name: Run pre commit checks
        run: nix develop --no-pure-eval --accept-flake-config -c devenv tasks run devenv:git-hooks
        env:
          # docs-check's host -- see the comment above the step list. The
          # dev shell inherits this, and prek passes it through to
          # scripts/check-docs.sh unmodified; the script splits MONAD_BIN
          # into words, so `cargo run ... --` composes with the per-fence
          # `check <file>` it appends.
          MONAD_BIN: cargo run --release --quiet --

      # The pipeline's only whole-corpus check, run through the RUST
      # REFERENCE host (`cargo run --release`). It exercises every rule the
      # reference enforces, including `use` completeness -- that rule is also
      # enforced BY DEFAULT in the loader on every check/run/test/build/LSP
      # path, so nothing here is opt-in and no caller can weaken it.
      #
      # The name says what the step is: it is broader than use-completeness
      # (it is the reference host's whole-corpus sweep, and the step that
      # catches host-only name-resolution differences such as a bare
      # `Event`/`Sub` colliding with a flattened corpus declaration). It
      # began as the `MONAD_USE_COMPLETENESS=error` flip, then replaced the
      # old `monad-check` pre-commit hook when that hook -- which ran this
      # same check on every commit in every worktree -- was removed.
      - name: Rust corpus check
        run: |
          nix develop --no-pure-eval --accept-flake-config -c \
            cargo run --release -- \
              check init std examples lang cli llvm runtime build motes

      # This step is why `nix/host.nix` may set `doCheck = false`: the flake's
      # host derivation skips the workspace's own `cargo test`, on the premise
      # that CI runs it from the dev shell. That premise used to be a
      # `rust-tests` pre-commit hook, which ran the suite on every commit in
      # every worktree; it is here instead (see devenv.nix).
      #
      # A step rather than a job, because a skipped STEP reports success while
      # a skipped JOB is a name branch protection would have to be told about:
      # a docs-only change costs nothing and a compiler change still gates the
      # job that already gates.
      - name: Rust test suite
        if: needs.changes.outputs.compiler == 'true'
        run: |
          nix develop --no-pure-eval --accept-flake-config -c \
            cargo test --release

  compiler-checks:
    runs-on: [self-hosted, linux]
    # Gated on the classifier: a change that touches no compiler input has
    # nothing for this job to build. A skipped job still reports
    # (as `skipped`, which required checks treat as passing, unlike a
    # skipped WORKFLOW), so this cannot strand a merge the way a
    # workflow-level `paths-ignore` would.
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    # Hang guard, not a deadline, for the whole step list: the host build,
    # the nightly install, and whichever self-compile leg runs -- ~1 min
    # for a nightly-hosted build, ~22 min for the interpreted fallback the
    # nightly's failure pays for, plus the cold host build the binary cache
    # usually substitutes. 90 min covers the worst ordering of those with
    # room for the runner's co-tenants.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # The FALLBACK host for this job's self-compile comes from the flake:
      # `packages.monadHost` is `cargo build -p monad-cli`, hermetically, and
      # MONAD_HOST_BIN is the knob scripts/build-self-hosted.sh already takes
      # for exactly this -- nix/monad.nix passes the same package the same way
      # (`lib.getExe`), and it is what removes `cargo run --release --`'s cold
      # fat-LTO build from this job. The PRIMARY host is the latest monadup
      # nightly, which the self-compile step installs itself; this binary is
      # what that step reaches for when the nightly cannot build the tree --
      # which makes it exactly as current as the tree under check, by
      # construction. A Rust compile error still fails HERE, in a step named
      # for the host.
      #
      # A packaged host is not self-sufficient the way `cargo run` was: the
      # path it reads its stdlib from is compiled IN (core/src/term/module.rs's
      # `stdlib_dir()`), so a store host carries a `/build/<src>-source/init/src`
      # path that exists only while the build that made it runs. The script
      # therefore points it at THIS checkout via MONAD_STDLIB -- which is what
      # the rung should mean anyway: the interpreter reads the tree the
      # self-compile reads. Run 36236800752 is what happens without it:
      # `failed to read /build/qkmvxrw…-source/init/src/prelude.mo`.
      #
      # The COMPILER is deliberately not taken from the flake in either leg:
      # the job self-compiles THIS checkout's sources
      # (scripts/ci-self-compile.sh -> scripts/build-self-hosted.sh), so the
      # verdict is about the tree, not a store-built copy of it.
      - name: Build the host from the flake
        run: |
          host="$(nix build --no-link --print-out-paths --accept-flake-config .#monadHost)"
          echo "MONAD_HOST_BIN=$host/bin/monad-rs" >> "$GITHUB_ENV"

      # Push the host this job just built, so the other runner and the Tangled
      # microVMs substitute it instead of paying the ~3 minute Rust build. The
      # path is named, not discovered: see scripts/push-to-cache.sh.
      - name: Push the host to the binary cache
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          paths="$(nix build --no-link --print-out-paths --accept-flake-config .#monadHost)"
          nix develop --no-pure-eval --accept-flake-config -c scripts/push-to-cache.sh $paths

      # The self-compile leg, and the whole substance of this job beyond
      # building the fallback host: `scripts/ci-self-compile.sh` installs the
      # latest monadup nightly (`monadup default`), self-compiles this
      # checkout with it as the host, and falls back to the flake's monad-rs
      # (MONAD_HOST_BIN from the step above) when the nightly cannot build
      # the tree -- a PR can outgrow a nightly cut from main, and the
      # failure is not always loud, so the Rust host stays the reference
      # the fallback builds with. The script's own header says what it
      # accepts as failure and what it does not.
      #
      # Called directly rather than through a devenv task: devenv-tasks
      # captures a task's stdout and shows it only on failure, and here the
      # output IS the diagnostic -- the compile's per-module stage trace and
      # which host leg produced the binary.
      #
      # `--profile` pins the devshell for the job: `nix develop` realizes it
      # but registers NO gc root, so every path the env only references could
      # in principle be collected mid-job. `--profile` installs it into a
      # profile under /nix/var/nix/gcroots/auto, rooting clang, llc, boehm-gc
      # and openssl for the whole job. The profile lives outside the checkout
      # so generations accumulate as profile generations (self-pruning)
      # rather than as checkout residue. The openssl fault it was originally
      # added for was a wrapper that SET `NIX_LDFLAGS` (now a `--prefix`,
      # nix/monad.nix), and a mote's libraries reach the link through
      # `[link] pkg-config` (llvm/src/link.mo's `pkg_config_link_flags`)
      # rather than through the environment at all.
      - name: Self-compile with the latest nightly (Rust host fallback)
        run: |
          nix develop --no-pure-eval --accept-flake-config \
            --profile "$HOME/.monad-ci-devshell" \
            -c scripts/ci-self-compile.sh

      # The clap spec parser/derive and the monadup mote, on the SELF-HOSTED
      # binary. These are the files that exercise the meta evaluator's new
      # String natives; passing under the Rust host is not enough.
      - name: Self-hosted clap and monadup tests
        run: |
          nix develop --no-pure-eval --accept-flake-config \
            --profile "$HOME/.monad-ci-devshell" \
            -c "$PWD/target-monad/ci-self-compile/monad" test motes/clap motes/monadup

      # monad-sql + monad-sqlite. The common mote's tests are pure and run
      # under either host; the driver's are compiled-only (`#[extern "c"]`,
      # `ByteBuf.ptr`, the runtime pointer helper). The devshell supplies
      # libsqlite3 and sqlite3.pc, which the mote's `[link]` needs.
      - name: Self-hosted SQL tests
        run: |
          nix develop --no-pure-eval --accept-flake-config \
            --profile "$HOME/.monad-ci-devshell" \
            -c "$PWD/target-monad/ci-self-compile/monad" test motes/sql motes/sqlite

      # The web stack's own suites: http/moon (the server and wire), jsgen,
      # web_wasm, xml_html, oak, and std's Ref primitive. They are not in
      # `motes/clap`/`motes/sql`, so without this step a regression in any
      # of them ships on a green CI. `motes/oak` is listed whole: the
      # dictionary-carrier fixes landed 2026-10-24, so `app_tests` and
      # `html_t_tests` compile and pass like the other three files.
      - name: Self-hosted web stack tests
        run: |
          nix develop --no-pure-eval --accept-flake-config \
            --profile "$HOME/.monad-ci-devshell" \
            -c "$PWD/target-monad/ci-self-compile/monad" test \
                 motes/http motes/moon motes/jsgen motes/web_wasm motes/xml_html \
                 motes/oak_wasm motes/oak \
                 std/src/ref_tests.mo

      # Phase 0-2 of plans/bootstrapping/wasm-target.md: the wasi fib
      # differential, the web loader smoke test, and clean target-gating
      # errors. Reuses the binary the step above just self-compiled, so it
      # pays no second compiler build; the script runs no cargo.
      - name: WASM target proof (wasi + web + gating)
        run: |
          nix develop --no-pure-eval --accept-flake-config \
            --profile "$HOME/.monad-ci-devshell" \
            -c scripts/check-wasm-target.sh \
              "$PWD/target-monad/ci-self-compile/monad"

      # plans/implementations/async-runtime-thread-safety.md: the runtime's
      # shared state (fd carry table, child registry, nullary cache) under
      # concurrent threads, plain and under ThreadSanitizer. Builds the C
      # runtime directly; no compiler involved.
      - name: Runtime thread-safety stress (TSAN)
        run: |
          nix develop --no-pure-eval --accept-flake-config \
            --profile "$HOME/.monad-ci-devshell" \
            -c scripts/check-runtime-threads.sh

  # The portable monadup binary and the distribution harness: the bootstrap
  # stub, the fixture-driven install path, doctor/env/new, and a monadup
  # built from this checkout actually driven through all of it.
  # `motes/monadup` changes are compiler-relevant (the classifier fails
  # open), so this runs for them.
  #
  # WHO BUILDS monadup is scripts/ci-monadup.sh: the latest monadup
  # NIGHTLY first (seconds, and it also supplies the `monad` that
  # type-checks the scaffold `new` writes), and the flake's `.#monadup`
  # only when the nightly cannot build the tree. The flake build is the
  # slow path for exactly the changes this job runs on: `.#monadup` emits
  # its IR with `monadRung1`, i.e. the Rust host interpreting the whole
  # compiler, so a compiler-touching PR misses the cache and waited ~15
  # minutes on every run before a single check. Scripts/ci-self-compile.sh
  # took the same nightly-first shape first.
  #
  # The portability/cache steps below still grade the flake artifact, on
  # main: a static relink that runs without a Nix store is a property of
  # the published packages, not of a pull request.
  monadup-checks:
    runs-on: [self-hosted, linux]
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Main only: the nightly leg never realizes `.#monadup`, so this is
      # the one place its store path is built before the cache push.
      - name: Build the portable monadup
        if: github.ref == 'refs/heads/main'
        run: |
          bin="$(nix build --no-link --print-out-paths --accept-flake-config .#monadup)"
          echo "MONADUP_BIN=$bin/bin/monadup" >> "$GITHUB_ENV"
          # No `file(1)` here: this step runs outside `nix develop`, and the
          # runner's PATH carries only bash/git/tar/coreutils (see
          # scripts/nightly-release.sh). The binary's own `--version` proves it
          # built and runs; the derivation's checkPhase asserts the same.
          "$bin/bin/monadup" --version

      # Main only, for the same reason: `MONADUP_BIN` is unset on a pull
      # request, where check-monadup.sh drives the nightly-built binary.
      - name: Portability check
        if: github.ref == 'refs/heads/main'
        run: |
          # The point of `.#monadup` is a binary that runs without a Nix
          # store. `nightly-release.sh` asserts this too, but only at publish
          # time; without this step a dynamic link would be green here.
          nix develop --no-pure-eval --accept-flake-config -c sh -c '
            file "$MONADUP_BIN"
            out="$(ldd "$MONADUP_BIN" 2>&1)" || true
            printf "%s\n" "$out"
            if printf "%s\n" "$out" | grep -q /nix/store; then
              echo "monadup links a /nix/store library" >&2
              exit 1
            fi
          '

      - name: Distribution and binary checks
        run: |
          nix develop --no-pure-eval --accept-flake-config \
            --profile "$HOME/.monad-ci-devshell" \
            -c scripts/ci-monadup.sh

      - name: Push monadup to the binary cache
        if: github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          paths="$(nix build --no-link --print-out-paths --accept-flake-config .#monadup)"
          nix develop --no-pure-eval --accept-flake-config -c scripts/push-to-cache.sh $paths

  # `packages.monad` left the per-PR path when `test` became `compiler-checks`:
  # the compiler job self-compiles this checkout's sources directly, so on a
  # compiler change the flake package is no longer built on the way to
  # anything -- and nothing else builds it either (the nightly builds only
  # `.#monadHost`), so the packaged artifact and its sandboxed build would go
  # unverified. This job is where they are verified, on the changes that can
  # move them.
  #
  # Gated on `flake`, NOT on `compiler`, and that is the whole point: `nix/**`,
  # `flake.nix` and `flake.lock` define the PACKAGING, while `compilerSrc`
  # (nix/monad.nix) is built from the source trees -- so an edit to `nix/`
  # usually leaves the interpretation a store hit and this job is minutes,
  # whereas a `flake.lock` bump moves the toolchain and is legitimately cold.
  # The compiler sources are covered on every compiler-relevant commit by
  # `compiler-checks`, which self-compiles the same binary from the same
  # tree, unwrapped.
  #
  # No `--no-pure-eval`, unlike every other nix invocation in this file: this
  # is an ordinary package build, and evaluating it purely is part of what the
  # flake is for. `--no-link --print-out-paths` so no `result` symlink is left
  # in the checkout. `nix/monad.nix` and `nix/bootstrap.nix` are the things
  # being graded -- and nix/bootstrap.nix's own header says why the nix-level
  # bootstrap beyond rung 1 is not a CI job at all.
  flake-package:
    runs-on: [self-hosted, linux]
    needs: changes
    if: needs.changes.outputs.flake == 'true'
    # Hang guard for a cold build, not a deadline: a sandboxed interpretation
    # of the whole tree (~22 min, the same rung-1 interpretation the
    # self-compile's fallback leg pays) plus the link
    # and wrapper steps. It is also the one build in this pipeline that runs
    # under a nix sandbox's RLIMIT_STACK, which is a reason to keep building it
    # rather than reason about it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Build the packaged compiler
        run: |
          monad="$(nix build --no-link --print-out-paths --accept-flake-config .#monad)"
          echo "flake-package: built $monad"

      # The highest-value push: `.#monad`'s input is the ~20 minute rung-1
      # interpretation. All three are named because a build input is NOT in the
      # output closure `cachix push` walks -- rung-1 alone would stay uncached.
      - name: Push the ladder to the binary cache
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          paths="$(nix build --no-link --print-out-paths --accept-flake-config \
            .#monadHost .#monadRung1 .#monad)"
          nix develop --no-pure-eval --accept-flake-config -c scripts/push-to-cache.sh $paths

      # The flake's inputs too: an input is fetched, not built, so no build hook
      # could ever see one, and only a store that starts empty wants them (the
      # microVMs; the runners keep theirs). Main only.
      - name: Push the flake's inputs
        if: github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix develop --no-pure-eval --accept-flake-config -c \
            scripts/push-to-cache.sh --inputs
