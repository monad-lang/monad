# Test-only mote: nothing to build or ship, just #[test] defs that are too
# expensive for the pre-commit sweep (they are ~91% of total test runtime).
# It carries a `src/lib.mo` hub because every mote must name one target that
# exists, not because anything imports it.
# `monad test slow_tests` is what runs them.

[mote]
name = "slow_tests"
version = "0.1.0"
edition = "2026"

[dependencies.init]
workspace = true

[dependencies.std]
workspace = true

[dependencies.lang]
workspace = true

[dependencies.llvm]
workspace = true
[dependencies.parsec]
workspace = true

# Affine-by-default migration exception (measured 2026-10-22).
# Delete this table when the mote reaches zero violations; the default
# (no table) is `mode = "error"`. See plans/type-system/quantitative-types.md.
[affine]
mode = "warn"
