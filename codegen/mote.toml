# The compiler backend: Monad terms to LLVM IR. It is a mote of its own so
# the front end (`lang`) never depends on it, and so the backend can be
# tested and cached as one unit.
#
# `lib.mo` is a small hub for the pipeline entry points; the stages
# (`emit`, `qualify`, `natives`, `validate`, ...) are imported by module
# path as `codegen::<module>`.

[mote]
name = "codegen"
version = "0.1.0"
edition = "2026"

[lib]
path = "src/lib.mo"

[dependencies.init]
workspace = true

[dependencies.std]
workspace = true

[dependencies.lang]
workspace = true

[dependencies.llvm]
workspace = true

# The kernel emitter (`src/kernel/shape.mo` on, Phase 2) lowers a kernel's
# signature and body into `MlirType`/`MlirOp` values and hands them to
# `mlir::print` and `mlir::tool`. `mlir` imports NEITHER `codegen` nor `lang`
# (its own manifest says so), so this stays a one-way edge -- the same shape
# `llvm` has, and `scripts/check-lang-no-codegen.sh` guards the sibling.
#
# Adding this edge is what makes `mlir/` part of the compiler-source surface:
# from here on it is compiled INTO the compiler, so `"mlir"` joins
# `scripts/build-self-hosted.sh`'s staleness scan and `nix/monad.nix`'s
# `compilerSrc` fileset. Those two edits and this one belong to the SAME
# commit as the first `use mlir::` line.
[dependencies.mlir]
workspace = true

[dependencies.runtime]
workspace = true

[dependencies.parsec]
workspace = true

# Affine-by-default migration exception (measured 2026-11-04). The backend
# was written inside `lang`, which is itself still migrating. Delete this
# table when `monad check codegen` is clean at the default error mode. See
# plans/type-system/quantitative-types.md.
[affine]
mode = "warn"
