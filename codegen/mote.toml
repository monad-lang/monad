# The compiler backend: Monad terms to LLVM IR. It is a mote of its own so
# the front end (`lang`) never depends on it, and so the backend can be
# tested and cached as one unit.
#
# `lib.mo` is a small hub for the pipeline entry points; the stages
# (`emit`, `qualify`, `natives`, `validate`, ...) are imported by module
# path as `codegen::<module>`.

[mote]
name = "codegen"
version = "0.1.0"
edition = "2026"

[lib]
path = "src/lib.mo"

[dependencies.init]
workspace = true

[dependencies.std]
workspace = true

[dependencies.lang]
workspace = true

[dependencies.llvm]
workspace = true

[dependencies.runtime]
workspace = true

[dependencies.parsec]
workspace = true

# Affine-by-default migration exception (measured 2026-11-04). The backend
# was written inside `lang`, which is itself still migrating. Delete this
# table when `monad check codegen` is clean at the default error mode. See
# plans/type-system/quantitative-types.md.
[affine]
mode = "warn"
