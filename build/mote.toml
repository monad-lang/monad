# The build orchestrator: input hashing, the content-addressed store, and
# the cache that lets `check`, `test` and a link skip work already done.
#
# A top-level mote rather than `motes/monad-build/` (which
# plans/library-ideas/monad-build.md specifies) because `cli` dispatches
# into it: that makes it a toolchain component like `llvm` and `runtime`,
# not a sample under `motes/*`. Recorded in
# plans/packaging/mote-build-deps-artifacts-targets.md as decision D2.

[mote]
name = "build"
version = "0.1.0"
edition = "2026"

[lib]
path = "src/lib.mo"

[dependencies.init]
path = "../init"

[dependencies.std]
path = "../std"

# The manifest reader, for walking a dependency closure
# (`build/src/closure.mo`). `lang` does not depend on `build`, so this is
# not a cycle -- and `cli` depending on `build` later keeps it acyclic.
[dependencies.lang]
path = "../lang"
[dependencies.parsec]
path = "../motes/parsec"
# `mote.lock` is TOML (`build/src/lock.mo`).
[dependencies.toml]
path = "../motes/toml"

# Affine-by-default migration exception (measured 2026-10-22).
# Delete this table when the mote reaches zero violations; the default
# (no table) is `mode = "error"`. See plans/type-system/quantitative-types.md.
[affine]
mode = "warn"
