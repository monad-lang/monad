[workspace]
resolver = "2"
members = ["core", "rust-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "ASL2"
authors = ["Anders Christiansen Sørby <anders@sorby.xyz>"]
homepage = "https://monad-lang.org"
repository = "https://tangled.org/monad-lang.org/monad"

[workspace.dependencies]
nom = "8.0.0"
paste = "1.0"
libc = "0.2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
im = "15.1"

# No `[profile.release]` section existed at all until now, so the host
# compiler ran at cargo's defaults: `codegen-units = 16` and `lto =
# false`. That matters more here than for a typical binary, because the
# workload that actually hurts is the Rust evaluator interpreting
# `lang/main.mo` -- a tight `core_eval.rs` dispatch loop calling into
# `core_native.rs`, split across crate boundaries that `lto = false`
# forbids inlining across. Measured A/B before keeping (see
# `plans/implementations/2026-09-09-compiler-optimization.md`, item B1).
[profile.release]
lto = "fat"
codegen-units = 1
