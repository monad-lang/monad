# The LLVM IR data model, its .ll text rendering, and the llc/clang glue
# that turns that text into a linked binary. Compiler-agnostic: nothing
# here knows what a Monad term is.

[mote]
name = "llvm"
version = "0.1.0"
edition = "2026"

[lib]
path = "src/lib.mo"

[dependencies.init]
workspace = true

[dependencies.std]
workspace = true

# Affine-by-default migration exception (measured 2026-10-22).
# Delete this table when the mote reaches zero violations; the default
# (no table) is `mode = "error"`. See plans/type-system/quantitative-types.md.
[affine]
mode = "warn"
