[package]
name = "monad-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
nom.workspace = true
paste.workspace = true
libc.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
im.workspace = true
clap = { version = "4", features = ["derive"], optional = true }
rustyline = { version = "17.0.2", optional = true }

[features]
default = []
# Marker feature gating `core_eval_bench` only -- the `CoreTerm`-closure
# evaluator (`core_check_module`, `lower_core_ir`, `core_value`,
# `core_eval`, `core_native`) is the crate's only evaluator/checker (the
# old tree-walker and its name-keyed-unifier checker have been removed —
# see `plans/implementations/core-term-closure-evaluator.md`) and is NOT
# itself feature-gated; it compiles and is tested unconditionally. This
# feature exists purely so `cargo bench` doesn't run the (expensive)
# core-eval benchmark by default.
core-eval = []
repl = ["dep:rustyline"]
cli = ["dep:clap"]

[dev-dependencies]
pretty_assertions = "1.4.1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "core_eval_bench"
harness = false
required-features = ["core-eval"]
