[package]
name = "monad-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
nom.workspace = true
paste.workspace = true
libc.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
rustyline = { version = "17.0.2", optional = true }

[features]
default = []
embed-stdlib = []
kernel = []
# Route module-level type checking through the OLD (name-keyed unifier)
# checker instead of the new De-Bruijn/MetaId-based one, which is the
# default. Exists purely to keep the old checker reachable as a working
# baseline/reference during the cutover — see
# plans/implementations/typechecker-de-bruijn-core.md.
legacy-checker = []
console_error_panic_hook = ["dep:console_error_panic_hook"]
repl = ["dep:rustyline"]
cli = ["dep:clap"]

[dev-dependencies]
pretty_assertions = "1.4.1"
