# The pure, portable core. Depends on nothing: it must work in any
# environment, wasm and embedded targets included (AGENTS.md, "init vs
# std"). Its own test files are what need std -- hence the dev-dependency,
# which a lib or bin target can never resolve through.

[mote]
name = "init"
version = "0.1.0"
edition = "2026"

[lib]
path = "src/lib.mo"

[dev-dependencies.std]
workspace = true

# Affine-by-default migration exception (measured 2026-10-22).
# Delete this table when the mote reaches zero violations; the default
# (no table) is `mode = "error"`. See plans/type-system/quantitative-types.md.
[affine]
mode = "warn"
