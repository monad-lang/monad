# Test-only mote: #[test]-driven micro-benchmarks (Bench.now/Bench.report),
# for occasional manual measurement rather than every-commit correctness.

[mote]
name = "bench"
version = "0.1.0"
edition = "2026"

[dependencies.std]
path = "../std"

[dependencies.lang]
path = "../lang"

[dependencies.llvm]
path = "../llvm"
[dependencies.parsec]
path = "../motes/parsec"

# Affine-by-default migration exception (measured 2026-10-22).
# Delete this table when the mote reaches zero violations; the default
# (no table) is `mode = "error"`. See plans/type-system/quantitative-types.md.
[affine]
mode = "warn"
